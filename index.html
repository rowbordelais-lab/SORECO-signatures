<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SORECO — Test ressources signatures</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #152848; background: #f4f7fa; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 4vw, 2.5rem); }
    p { margin: 0 0 32px; color: #4a5668; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 18px; min-height: 220px; display: flex; flex-direction: column; gap: 14px; justify-content: space-between; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgb(21 40 72 / 12%); }
    img { display: block; max-width: 100%; max-height: 180px; width: auto; height: auto; margin: auto; object-fit: contain; }
    figcaption { font-weight: 700; text-align: center; color: #152848; }
  </style>
</head>
<body>
  <main>
    <h1>SORECO — Test ressources signatures</h1>
    <p>Vérification des six ressources publiques destinées aux signatures e-mail.</p>
    <section class="grid" aria-label="Ressources d'image">
      <figure><img src="images/soreco-logo-bleu.jpg" alt="Logo SORECO Construction bleu"><figcaption>Logo SORECO Construction bleu</figcaption></figure>
      <figure><img src="images/telephone-bleu.jpg" alt="Icône téléphone bleue"><figcaption>Icône téléphone bleue</figcaption></figure>
      <figure><img src="images/email-bleu.jpg" alt="Icône e-mail bleue"><figcaption>Icône e-mail bleue</figcaption></figure>
      <figure><img src="images/soreco-logo-vert.jpg" alt="Logo SORECO vert"><figcaption>Logo SORECO vert</figcaption></figure>
      <figure><img src="images/telephone-vert.jpg" alt="Icône téléphone verte"><figcaption>Icône téléphone verte</figcaption></figure>
      <figure><img src="images/email-vert.jpg" alt="Icône e-mail verte"><figcaption>Icône e-mail verte</figcaption></figure>
    </section>
  </main>
</body>
</html>
